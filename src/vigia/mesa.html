<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vigia Mesa</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script>
/* Theme before first paint: a stored choice wins; otherwise desktop is dark and the phone follows the system. */
(function () {
  var t = null;
  try { t = window.localStorage.getItem("mesa.theme"); } catch (e) {}
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else if (window.matchMedia && window.matchMedia("(min-width: 1024px)").matches) document.documentElement.setAttribute("data-theme", "dark");
})();
</script>
<style>
/* The Mesa, v2. Every colour is a --mesa-* token; the private Mesa renames them to --mm-* one for one.
   Amber (turn) only for "needs a human"; blue running; green done; red stopped; grey waiting or skipped.
   Colour is never alone: every state also has a glyph and a word. */
:root {
  --mesa-font: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mesa-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
  --mesa-bg: oklch(0.972 0.006 80); --mesa-surface: oklch(0.995 0.003 80); --mesa-surface-2: oklch(0.948 0.008 80);
  --mesa-line: oklch(0.885 0.010 80); --mesa-line-strong: oklch(0.780 0.012 80);
  --mesa-ink: oklch(0.230 0.015 255); --mesa-ink-2: oklch(0.420 0.015 255); --mesa-ink-3: oklch(0.520 0.012 255); --mesa-on-ink: oklch(0.980 0.004 80);
  --mesa-turn: oklch(0.680 0.150 58); --mesa-turn-ink: oklch(0.480 0.120 52); --mesa-turn-bg: oklch(0.955 0.040 72);
  --mesa-live: oklch(0.560 0.150 255); --mesa-live-ink: oklch(0.460 0.140 255); --mesa-live-bg: oklch(0.950 0.030 255);
  --mesa-ok: oklch(0.600 0.120 155); --mesa-ok-ink: oklch(0.440 0.100 155); --mesa-ok-bg: oklch(0.950 0.035 155);
  --mesa-danger: oklch(0.560 0.170 28); --mesa-danger-ink: oklch(0.470 0.150 28); --mesa-danger-bg: oklch(0.955 0.025 28);
  --mesa-scrim: oklch(0.200 0.015 255 / 0.40);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --mesa-bg: oklch(0.165 0.010 255); --mesa-surface: oklch(0.205 0.012 255); --mesa-surface-2: oklch(0.245 0.014 255);
  --mesa-line: oklch(0.300 0.014 255); --mesa-line-strong: oklch(0.420 0.016 255);
  --mesa-ink: oklch(0.950 0.005 80); --mesa-ink-2: oklch(0.800 0.010 80); --mesa-ink-3: oklch(0.680 0.010 80); --mesa-on-ink: oklch(0.170 0.010 255);
  --mesa-turn: oklch(0.780 0.140 65); --mesa-turn-ink: oklch(0.850 0.110 70); --mesa-turn-bg: oklch(0.300 0.060 60);
  --mesa-live: oklch(0.720 0.130 255); --mesa-live-ink: oklch(0.800 0.110 255); --mesa-live-bg: oklch(0.280 0.060 255);
  --mesa-ok: oklch(0.740 0.130 155); --mesa-ok-ink: oklch(0.820 0.120 155); --mesa-ok-bg: oklch(0.280 0.050 155);
  --mesa-danger: oklch(0.700 0.160 28); --mesa-danger-ink: oklch(0.800 0.130 28); --mesa-danger-bg: oklch(0.270 0.050 28);
  --mesa-scrim: oklch(0.080 0.010 255 / 0.60);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --mesa-bg: oklch(0.165 0.010 255); --mesa-surface: oklch(0.205 0.012 255); --mesa-surface-2: oklch(0.245 0.014 255);
  --mesa-line: oklch(0.300 0.014 255); --mesa-line-strong: oklch(0.420 0.016 255);
  --mesa-ink: oklch(0.950 0.005 80); --mesa-ink-2: oklch(0.800 0.010 80); --mesa-ink-3: oklch(0.680 0.010 80); --mesa-on-ink: oklch(0.170 0.010 255);
  --mesa-turn: oklch(0.780 0.140 65); --mesa-turn-ink: oklch(0.850 0.110 70); --mesa-turn-bg: oklch(0.300 0.060 60);
  --mesa-live: oklch(0.720 0.130 255); --mesa-live-ink: oklch(0.800 0.110 255); --mesa-live-bg: oklch(0.280 0.060 255);
  --mesa-ok: oklch(0.740 0.130 155); --mesa-ok-ink: oklch(0.820 0.120 155); --mesa-ok-bg: oklch(0.280 0.050 155);
  --mesa-danger: oklch(0.700 0.160 28); --mesa-danger-ink: oklch(0.800 0.130 28); --mesa-danger-bg: oklch(0.270 0.050 28);
  --mesa-scrim: oklch(0.080 0.010 255 / 0.60);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--mesa-bg); color: var(--mesa-ink); font: 400 15px/1.45 var(--mesa-font); }
body.locked { overflow: hidden; }
a { color: var(--mesa-ink); }
a:hover { color: var(--mesa-ink-2); }
button { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
code { font: 500 12.5px var(--mesa-mono); padding: 1px 5px; border-radius: 5px; background: var(--mesa-surface-2); }
:focus-visible { outline: 2px solid var(--mesa-live); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mesa-mono); }
.grow { flex: 1; }
.wrap-any { overflow-wrap: anywhere; }
.lg-a { fill: var(--mesa-ink); } .lg-b { fill: var(--mesa-turn); } .lg-c { fill: var(--mesa-on-ink); }

/* type */
.t-display { font: 700 34px/1.05 var(--mesa-font); letter-spacing: -0.025em; }
.t-title { font: 700 30px/1.05 var(--mesa-font); letter-spacing: -0.025em; }
.t-section { font: 650 20px/1.2 var(--mesa-font); letter-spacing: -0.01em; }
.t-card { font: 600 17px/1.3 var(--mesa-font); letter-spacing: -0.01em; overflow-wrap: anywhere; }
.t-sub { color: var(--mesa-ink-2); font-size: 15px; }
.kicker { font: 600 11px/1.2 var(--mesa-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mesa-ink-3); overflow-wrap: anywhere; }
.k-turn { color: var(--mesa-turn-ink); } .k-danger { color: var(--mesa-danger-ink); } .k-live { color: var(--mesa-live-ink); } .k-ok { color: var(--mesa-ok-ink); }
.meta { font: 400 12px/1.5 var(--mesa-mono); color: var(--mesa-ink-3); overflow-wrap: anywhere; }
.age { font: 500 12px/1 var(--mesa-mono); color: var(--mesa-ink-3); white-space: nowrap; }
.note { font-size: 13px; color: var(--mesa-ink-2); overflow-wrap: anywhere; }
.foot { font-size: 12.5px; line-height: 1.5; color: var(--mesa-ink-3); }
.c-ok { color: var(--mesa-ok-ink); } .c-danger { color: var(--mesa-danger-ink); } .c-live { color: var(--mesa-live-ink); } .c-turn { color: var(--mesa-turn-ink); } .c-3 { color: var(--mesa-ink-3); } .c-2 { color: var(--mesa-ink-2); }

/* chips and badges */
.chip { flex: none; display: inline-block; font: 600 11px/1 var(--mesa-mono); padding: 5px 7px; border-radius: 6px; white-space: nowrap; }
.tier-T2 { background: var(--mesa-ink); color: var(--mesa-on-ink); }
.tier-T1 { background: var(--mesa-surface-2); color: var(--mesa-ink); box-shadow: inset 0 0 0 1px var(--mesa-line-strong); }
.tier-T0, .tier-x { color: var(--mesa-ink-2); box-shadow: inset 0 0 0 1px var(--mesa-line); }
.chip.s-danger { background: var(--mesa-danger-bg); color: var(--mesa-danger-ink); }
.chip.s-live { background: var(--mesa-live-bg); color: var(--mesa-live-ink); }
.chip.s-turn { background: var(--mesa-turn-bg); color: var(--mesa-turn-ink); }
.chip.s-ok { background: var(--mesa-ok-bg); color: var(--mesa-ok-ink); }
.fact { flex: none; display: inline-block; font: 500 12px/1 var(--mesa-mono); padding: 5px 7px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--mesa-line); color: var(--mesa-ink-2); white-space: nowrap; }
.fact.strong { box-shadow: inset 0 0 0 1px var(--mesa-line-strong); }
.badge { display: inline-block; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--mesa-turn-ink); color: var(--mesa-on-ink); font: 600 11px/18px var(--mesa-mono); text-align: center; }
.badge.md { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; font-size: 12px; line-height: 22px; }
.badge.lg { min-width: 28px; height: 28px; padding: 0 8px; border-radius: 14px; font-size: 15px; line-height: 28px; }
.badge.xl { min-width: 32px; height: 32px; padding: 0 9px; border-radius: 16px; font-size: 16px; line-height: 32px; }

/* buttons: ↗ = leaves the Mesa; no ↗ = changes only this device's view */
.btn { display: inline-flex; align-items: center; justify-content: center; text-align: center; gap: 6px; min-height: 44px; padding: 0 16px;
  border-radius: 10px; font: 600 14px/1.15 var(--mesa-font); text-decoration: none; cursor: pointer; border: 1px solid transparent; }
.btn-primary { background: var(--mesa-ink); color: var(--mesa-on-ink); border-color: var(--mesa-ink); }
.btn-primary:hover { color: var(--mesa-on-ink); opacity: 0.92; }
.btn-secondary { background: var(--mesa-surface-2); color: var(--mesa-ink); border-color: var(--mesa-line-strong); }
.btn-ghost { background: transparent; color: var(--mesa-ink-2); border-color: var(--mesa-line); }
.btn-quiet { background: transparent; color: var(--mesa-ink-2); padding: 0 4px; }
.btn-main { min-height: 48px; font-size: 15px; gap: 8px; }
.btn-big { min-height: 52px; border-radius: 12px; font-size: 16px; gap: 8px; }
.btn-tall { min-height: 46px; border-radius: 12px; font-size: 15px; }
.btn-ok { background: var(--mesa-ok-bg); color: var(--mesa-ok-ink); border-color: var(--mesa-ok); }
.btn.is-off, .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn-row > * { flex: 1 1 auto; white-space: nowrap; }
.icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; text-align: center; border: 0; border-radius: 10px;
  background: transparent; color: var(--mesa-ink-2); cursor: pointer; text-decoration: none; flex: none; }
.icon-btn.boxed { border: 1px solid var(--mesa-line); }

/* segmented and toggles */
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--mesa-surface-2); border: 1px solid var(--mesa-line); }
.seg button { flex: 1; min-height: 44px; padding: 0 12px; border: 0; border-radius: 7px; cursor: pointer; background: transparent; color: var(--mesa-ink-2);
  font: 500 13px/1 var(--mesa-font); text-align: center; }
.seg button[aria-pressed="true"] { background: var(--mesa-surface); color: var(--mesa-ink); box-shadow: 0 0 0 1px var(--mesa-line-strong); font-weight: 600; }
.seg.inline { display: inline-flex; }
.seg.inline button { flex: none; }

/* status: is it live? */
.pill { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--mesa-line);
  background: var(--mesa-surface); font: 500 12px/1 var(--mesa-mono); color: var(--mesa-ink-2); white-space: nowrap; }
.pill b { font-weight: 500; color: var(--mesa-ink); }
.pill b.c-live { color: var(--mesa-live-ink); font-weight: 600; } .pill b.c-ok { color: var(--mesa-ok-ink); font-weight: 600; } .pill b.c-3 { color: var(--mesa-ink-3); }
.pill.quiet { background: var(--mesa-danger-bg); border-color: transparent; color: var(--mesa-danger-ink); font-weight: 600; }
.pill.ro { background: var(--mesa-surface-2); border-color: transparent; font: 600 12.5px/1 var(--mesa-font); gap: 6px; }
.dot { flex: none; width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.ok { background: var(--mesa-ok); } .dot.live { background: var(--mesa-live); } .dot.danger { background: var(--mesa-danger); }
.dot.hollow { box-shadow: inset 0 0 0 1.5px var(--mesa-ink-3); } .dot.free { box-shadow: inset 0 0 0 1.5px var(--mesa-line-strong); }
.dot.big { width: 8px; height: 8px; }
@keyframes mesa-pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: no-preference) { .pulse { animation: mesa-pulse 1.8s ease-in-out infinite; } }

/* the six-step track: done | now | wait (you) | stop | skip | todo */
.track { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; align-items: end; }
.cell { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.cell-l { font: 500 11px/1 var(--mesa-mono); color: var(--mesa-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell-b { display: block; height: 4px; border-radius: 2px; }
.cell.done .cell-b { background: var(--mesa-ink-3); }
.cell.now .cell-b { height: 8px; background: var(--mesa-live); }
.cell.wait .cell-b { height: 8px; background: var(--mesa-turn); }
.cell.stop .cell-b { height: 8px; background: var(--mesa-danger); }
.cell.todo .cell-b { box-shadow: inset 0 0 0 1px var(--mesa-line-strong); }
.cell.skip .cell-b { height: 0; border-top: 2px dotted var(--mesa-line-strong); margin-bottom: 1px; border-radius: 0; }
.cell.now .cell-l { color: var(--mesa-live-ink); font-weight: 600; }
.cell.wait .cell-l { color: var(--mesa-turn-ink); font-weight: 600; }
.cell.stop .cell-l { color: var(--mesa-danger-ink); font-weight: 600; }
.track.lg { gap: 6px; max-width: 760px; }
.track.lg .cell { gap: 7px; }
.track.lg .cell-l { font-size: 12px; }
.track.lg .cell.now .cell-b, .track.lg .cell.wait .cell-b, .track.lg .cell.stop .cell-b { height: 10px; }

/* cards */
.card { background: var(--mesa-surface); border: 1px solid var(--mesa-line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.tight { gap: 4px; }
.card.dashed { background: transparent; border-style: dashed; border-color: var(--mesa-line-strong); }
.card.dashed .btn-quiet { align-self: flex-start; }
.k-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.k-row .kicker { min-width: 0; }
.why-box { background: var(--mesa-danger-bg); border-radius: 10px; padding: 12px 14px; font-size: 14.5px; line-height: 1.4; overflow-wrap: anywhere; }
.evidence { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.evidence li { display: flex; gap: 8px; overflow-wrap: anywhere; min-width: 0; }
.evidence li > span:first-child { font-weight: 600; flex: none; }
.rows > .row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--mesa-line); text-decoration: none; color: var(--mesa-ink); min-height: 44px; }
.row .stack { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.row .ref { font: 500 12px/1.3 var(--mesa-mono); color: var(--mesa-ink-3); overflow-wrap: anywhere; }
.row .q { font: 500 15px/1.35 var(--mesa-font); overflow-wrap: anywhere; }
.wide-card { display: flex; flex-direction: row; flex-wrap: wrap; gap: 16px 24px; padding: 20px; }
.wide-card > .l { flex: 999 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.wide-card > .r { flex: 1 1 220px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; }
.desk-rows > .row { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 16px; align-items: baseline; }

/* group labels and empty states */
.group-h { font: 600 11px/1 var(--mesa-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mesa-ink-3); }
.empty { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px; border-radius: 12px; border: 1px solid var(--mesa-line); background: var(--mesa-bg); }
.empty.on-surface { background: var(--mesa-surface); }
.empty .ic { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 600 15px/1 var(--mesa-mono); }
.empty .ic.ok { background: var(--mesa-ok-bg); color: var(--mesa-ok-ink); }
.empty .ic.idle { background: var(--mesa-surface-2); color: var(--mesa-ink-3); }
.empty .ic.danger { background: var(--mesa-danger); color: var(--mesa-on-ink); }
.empty .ic.warn { background: var(--mesa-surface-2); color: var(--mesa-danger-ink); }
.empty .tx { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.empty .tx b { font: 600 14.5px/1.3 var(--mesa-font); }
.empty .tx span { font-size: 13px; line-height: 1.45; color: var(--mesa-ink-2); overflow-wrap: anywhere; }
.empty.watcher { border-color: var(--mesa-danger); background: var(--mesa-danger-bg); }
.empty.github { border-color: var(--mesa-line-strong); }
.err-detail { font: 400 11.5px/1.4 var(--mesa-mono); color: var(--mesa-ink-3); overflow-wrap: anywhere; }
.sample { font: 500 12px/1.4 var(--mesa-mono); color: var(--mesa-turn-ink); background: var(--mesa-turn-bg); padding: 8px 12px; border-radius: 8px; overflow-wrap: anywhere; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; border-radius: 12px; overflow: hidden; border: 1px solid var(--mesa-line); background: var(--mesa-line); }
.tile { background: var(--mesa-surface); padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile b { font: 650 22px/1.1 var(--mesa-font); font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--mesa-ink-2); }
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tiles.two .tile { padding: 12px 14px; }
.tiles.two .tile b { font-size: 26px; }
.tiles.two .tile span { font-size: 13px; }

/* sessions */
.sess { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--mesa-line); }
.sess .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sess .what { font: 600 15px/1.2 var(--mesa-font); min-width: 0; overflow-wrap: anywhere; }
.sess .sage { font: 600 13px/1 var(--mesa-mono); color: var(--mesa-live-ink); white-space: nowrap; }
.sess .eng { font: 400 12px/1.3 var(--mesa-mono); color: var(--mesa-ink-3); padding-left: 16px; overflow-wrap: anywhere; }
.sess .bar { margin-left: 16px; height: 4px; border-radius: 2px; background: var(--mesa-surface-2); overflow: hidden; display: flex; }
.sess .bar i { display: block; height: 100%; background: var(--mesa-live); }
.sess.over .sage { color: var(--mesa-danger-ink); }
.sess.over .bar i { background: var(--mesa-danger); }
.slotgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px; }
.slot { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 12px; background: var(--mesa-surface); border: 1px solid var(--mesa-line); min-width: 0; }
.slot .top { display: flex; align-items: center; gap: 8px; }
.slot .what { flex: 1; font: 600 14px/1.2 var(--mesa-font); min-width: 0; overflow-wrap: anywhere; }
.slot .sage { font: 600 12.5px/1 var(--mesa-mono); color: var(--mesa-live-ink); white-space: nowrap; }
.slot .eng { font: 400 12px/1.3 var(--mesa-mono); color: var(--mesa-ink-3); overflow-wrap: anywhere; }
.slot .bar { height: 4px; border-radius: 2px; background: var(--mesa-surface-2); overflow: hidden; display: flex; }
.slot .bar i { display: block; height: 100%; background: var(--mesa-live); }
.slot.free { background: transparent; border-style: dashed; border-color: var(--mesa-line-strong); color: var(--mesa-ink-3); }
.slot.over { border-color: var(--mesa-danger); }
.slot.over .sage { color: var(--mesa-danger-ink); }
.slot.over .bar i { background: var(--mesa-danger); }
.strip { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border-radius: 12px; background: var(--mesa-surface); border: 1px solid var(--mesa-line); text-decoration: none; color: var(--mesa-ink); }
.strip .bars { display: flex; gap: 3px; flex: none; }
.strip .bars i { width: 6px; height: 18px; border-radius: 2px; box-shadow: inset 0 0 0 1px var(--mesa-line-strong); display: block; }
.strip .bars i.on { background: var(--mesa-live); box-shadow: none; }
.strip .tx { flex: 1; font-size: 13.5px; color: var(--mesa-ink-2); min-width: 0; }
.strip .tx b { color: var(--mesa-ink); font-weight: 600; }
.mini-slots { display: flex; gap: 3px; }
.mini-slots i { width: 14px; height: 8px; border-radius: 2px; box-shadow: inset 0 0 0 1px var(--mesa-line-strong); display: block; }

/* factory: PR cards and the desktop board */
.prcard { display: flex; flex-direction: column; gap: 10px; background: var(--mesa-surface); border: 1px solid var(--mesa-line); border-radius: 14px; padding: 14px; text-decoration: none; color: var(--mesa-ink); min-width: 0; }
.prcard .hd { display: flex; align-items: flex-start; gap: 10px; }

          return h("div", { "class": "sess" + (s.over ? " over" : ""), style: "gap:5px" }, h("div", { "class": "top" }, h("span", { "class": "dot " + (s.over ? "danger" : "live pulse") }),
            h("span", { "class": "what", style: "font-size:14px;flex:1" }, s.what), h("span", { "class": "sage", style: "font-size:12.5px" }, s.age)), h("span", { "class": "eng", style: "padding-left:15px" }, s.eng));

        mergedRows().length ? mergedRows().map(function (x) {
          return h("div", { style: "display:flex;align-items:center;gap:10px;min-height:40px;border-top:1px solid var(--mesa-line)" }, h("span", { "class": "c-ok", style: "font-weight:600" }, "✓"),
            h("span", { style: "flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" }, short(x.r.repo) + " #" + x.m.pr + (x.m.title ? " · " + x.m.title : "")),
            h("span", { "class": "age" }, (x.m.tier || "") + " " + hhmm(x.m.ts)));
        }) : h("span", { "class": "note" }, "Nothing merged today yet.")),
      h("section", { "class": "side-card", "aria-labelledby": "fuel-h", style: "gap:12px" }, h("h2", { id: "fuel-h" }, "Fuel"),
        h("div", { "class": "mini-tank" }, h("span", { "class": "hr" }, h("span", null, "Codex"), h("span", { "class": left != null && left < 30 ? "c-danger" : null }, left == null ? "unknown" : pct(left) + " left")),
          left == null ? h("span", { "class": "meter sm unknown", "aria-hidden": "true" }) : h("span", { "class": "meter sm", "aria-hidden": "true" }, h("i", { "class": left < 30 ? "low" : null, style: "width:" + left + "%" })),
          c && resetsText(c.resets_at) ? h("span", { "class": "meta" }, resetsText(c.resets_at)) : null),
        h("div", { "class": "mini-tank" }, h("span", { "class": "hr" }, h("span", null, "Claude"), h("span", { "class": "c-3" }, "unknown")), h("span", { "class": "meter sm unknown", "aria-hidden": "true" }),
          h("span", { "class": "meta" }, plural(cu.sessions_7d || 0, "session") + " this week · check /usage"))));
  }
  function deskShell() {
    var rt = S.route, m = turnModel();
    if (rt.name === "decide") return h("div", null, deskDecision());

    if (rt.name === "turn") {
      main = h("main", { "class": "dk-main" }, head, h("div", { style: "display:flex;flex-direction:column;gap:6px" },
        h("h1", { "class": "t-display", style: "display:flex;align-items:center;gap:12px" }, "Your turn", m.count ? h("span", { "class": "badge xl" }, String(m.count)) : null),
        turnLine(m, true) ? h("p", { style: "font-size:16px;color:var(--mesa-ink-2)" }, turnLine(m, true)) : null), turnGroups(m, true));
      aside = deskTurnAside();
    } else if (rt.name === "factory") {
      main = h("main", { "class": "dk-main wide" }, head, deskFactory());
    } else {
      var title = { captures: ["Captures", "UI changes, before and after, on the exact head. Looking never blocks a merge."], feed: ["Feed", "What vigia did, newest first. Every line is one ledger row."], fuel: ["Fuel", "What each lab's plan has left this week, and what vigia spent from it."] }[rt.name];
      var body = { captures: capturesBody, feed: function () { return feedBody(true); }, fuel: function () { return fuelBody(true); } }[rt.name]();
      main = h("main", { "class": "dk-main" }, head, h("div", { style: "display:flex;flex-direction:column;gap:6px" }, h("h1", { "class": "t-display" }, title[0]), h("p", { style: "font-size:16px;color:var(--mesa-ink-2)" }, title[1])), body);
    }
    return h("div", null, deskTop(m.count, rt.name), h("div", { "class": "dk-body" }, rail(rt.name, m), main, aside));
  }

  /* ---------- render: never while you type or while a sheet is open from a poll ---------- */
  var app = document.getElementById("app");
  function busyTyping() {
    var a = document.activeElement;
    return a && app.contains(a) && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "checkbox"));
  }
  function render() {
    if (busyTyping() || S.manual) { S.dirty = true; return; }
    renderNow();
  }
  function renderNow() {
    S.dirty = false;
    var a = document.activeElement, fk = a && app.contains(a) ? a.getAttribute("data-k") : null;
    var node;
    if (!S.state) {
      node = h("div", { "class": "gut", style: "padding-top:24px;display:flex;flex-direction:column;gap:12px;max-width:720px;margin:0 auto" },
        h("div", { style: "display:flex;align-items:center;gap:10px" }, logo(24), h("span", { "class": "brand" }, "vigia"), h("span", { "class": "brand-k" }, "Mesa")),
        S.error ? banner() : h("p", { "class": "note" }, "Reading vigia's state…"));
    } else {
      node = DESK.matches ? deskShell() : phoneShell();
    }
    while (app.firstChild) app.removeChild(app.firstChild);
    app.appendChild(node);
    if (S.manual) app.appendChild(manualSheet());
    document.body.classList.toggle("locked", !!(S.manual || S.sheet));
    if (S.focusSheet) {  // a sheet that just opened takes the focus
      S.focusSheet = false;
      fk = S.manual ? "manual-close" : "sheet-close";
    }
    if (fk) {
      var el = null;
      try { el = app.querySelector('[data-k="' + (window.CSS && CSS.escape ? CSS.escape(fk) : fk) + '"]'); } catch (e) { el = null; }
      if (el) el.focus({ preventScroll: true });
    }
  }
  function manualSheet() {
    var m = S.manual;
    var pre = h("pre", { "class": "brief", tabindex: "0", style: "max-height:240px" }, m.text);
    function close() { S.manual = null; renderNow(); }
    return h("div", { "class": "scrim", on: { click: close } }, h("section", { "class": "sheet", role: "dialog", "aria-modal": "true", "aria-labelledby": "manual-h", on: { click: function (e) { e.stopPropagation(); } } },
      h("span", { "class": "grab", "aria-hidden": "true" }),
      h("div", { style: "display:flex;align-items:center;gap:8px" }, h("h2", { id: "manual-h" }, "Copy by hand"),
        h("button", { type: "button", "class": "icon-btn", "aria-label": "Close", "data-k": "manual-close", on: { click: close } }, icon("close", 20))),
      h("p", { "class": "note", style: "font-size:14px" }, "This browser did not let the Mesa use the clipboard: it needs https or localhost, and your permission. Copy by hand: select the text below and copy it."),
      pre,
      h("button", { type: "button", "class": "btn btn-secondary", "data-k": "select-all", on: { click: function () {
        try { var sel = window.getSelection(), range = document.createRange(); range.selectNodeContents(pre); sel.removeAllRanges(); sel.addRange(range); } catch (e) {}
      } } }, "Select all"),
      m.url ? ext(m.url, m.label || "Open", "btn btn-primary btn-big") : null));
  }
  // a poll that arrived while you typed renders after you leave the field, late enough not to eat the click that moved focus
  app.addEventListener("focusout", function () { setTimeout(function () { if (S.dirty && !busyTyping() && !S.manual) renderNow(); }, 600); });

  /* ---------- routes: #/turn #/factory #/captures #/feed #/fuel #/decide[/owner/repo/n] #/pr/owner/repo/n ---------- */
  function parseRoute() {
    var p = location.hash.replace(/^#\/?/, "").split("/");
    if (p[0] === "pr" && p.length === 4 && NAME.test(p[1]) && NAME.test(p[2]) && /^\d{1,9}$/.test(p[3])) return { name: "pr", repo: p[1] + "/" + p[2], n: Number(p[3]) };
    if (p[0] === "decide") {
      if (p.length === 4 && NAME.test(p[1]) && NAME.test(p[2]) && /^\d{1,9}$/.test(p[3])) return { name: "decide", repo: p[1] + "/" + p[2], n: Number(p[3]) };
      return { name: "decide" };
    }
    if (PLACE_IDS.indexOf(p[0]) >= 0) return { name: p[0] };
    return null;
  }
  function onRoute() {
    var prev = S.route, rt = parseRoute();
    if (!rt) {
      var saved = store.get("mesa.tab");
      rt = { name: PLACE_IDS.indexOf(saved) >= 0 ? saved : "turn" };
    }
    if (PLACE_IDS.indexOf(rt.name) >= 0) { S.lastPlace = rt.name; store.set("mesa.tab", rt.name); }
    var same = prev && prev.name === rt.name && prev.repo === rt.repo && prev.n === rt.n;
    S.route = rt;
    if (!same) { S.sheet = null; S.flash = null; }
    if (rt.name === "pr" && !same) fetchPR(rt);
    renderNow();
    if (!same && !(prev && prev.name === "decide" && rt.name === "decide")) window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", onRoute);
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (S.manual) { S.manual = null; renderNow(); }
    else if (S.sheet) { S.sheet = null; S.flash = null; renderNow(); }
  });
  function onLayout() { applyTheme(); renderNow(); }
  if (DESK.addEventListener) DESK.addEventListener("change", onLayout); else if (DESK.addListener) DESK.addListener(onLayout);

  /* ---------- data: GET /api/state every 15 s, read-only ---------- */
  function load() {
    fetch("/api/state", { cache: "no-store", credentials: "same-origin" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (s) {
        var polled = !!S.lastOk; // the first read comes with the route's own fetch of the detail
        S.state = s; S.error = null; S.lastOk = Date.now();
        if (polled && S.route && S.route.name === "pr") fetchPR(S.route, true); // the open screen follows the watcher too
        render();
      },
        function (e) { S.error = String(e && e.message || e); render(); });
  }
  var embedded = (document.getElementById("mesa-sample").textContent || "").trim();
  if (embedded.charAt(0) === "{") {
    try { S.state = JSON.parse(embedded); S.sample = true; S.lastOk = Date.now(); } catch (e) { S.state = null; }
  }
  applyTheme();
  onRoute();
  if (!S.sample) { load(); setInterval(load, POLL_MS); }
})();
